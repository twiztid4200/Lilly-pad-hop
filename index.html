<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$PMUSH LILLY PAD HOP – COSMIC ULTIMATE EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        :root {
            --neon-cyan: #00f7ff;
            --neon-purple: #c300ff;
            --neon-gold: #ffd700;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0f2e;
            font-family: 'Press Start 2P', system-ui;
            touch-action: none;
            user-select: none;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            color: white;
            text-shadow: 0 0 15px var(--neon-cyan);
        }
        
        .menu, .pause-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 46, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: opacity 0.25s ease;
            text-align: center;
        }
        
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 {
            font-size: 2.8rem;
            margin: 0 0 20px;
            background: linear-gradient(90deg, #00f7ff, #c300ff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px #00f7ff;
            letter-spacing: 4px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #00f7ff;
            margin-bottom: 30px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #c300ff;
        }
        
        button {
            background: linear-gradient(#1a0033, #0a0f2e);
            color: #00f7ff;
            border: 4px solid #00f7ff;
            padding: 18px 40px;
            margin: 12px;
            font-size: 1.4rem;
            font-family: 'Press Start 2P', system-ui;
            border-radius: 9999px;
            box-shadow: 0 0 25px #00f7ff,
                        0 0 50px #c300ff;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px #00f7ff,
                        0 0 70px #ffd700;
        }
        
        .score-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #00f7ff;
            text-shadow: 0 0 20px #00f7ff;
            z-index: 20;
            pointer-events: none;
        }
        
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            width: 60px;
            height: 60px;
            background: rgba(26, 0, 51, 0.7);
            border: 4px solid #00f7ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00f7ff;
            box-shadow: 0 0 25px #00f7ff;
            z-index: 20;
            pointer-events: all;
            cursor: pointer;
        }
        
        .touch-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            z-index: 30;
            opacity: 0.7;
        }
        
        .touch-btn {
            width: 90px;
            height: 90px;
            background: rgba(195, 0, 255, 0.3);
            border: 6px solid #c300ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #c300ff;
            box-shadow: 0 0 30px #c300ff;
            pointer-events: all;
        }
        
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a0033;
            padding: 30px;
            border: 6px solid #00f7ff;
            border-radius: 20px;
            box-shadow: 0 0 60px #ffd700;
            max-width: 90%;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <!-- HUD -->
    <div id="overlay">
        <div class="score-hud" id="scoreDisplay">0</div>
        <div class="pause-btn" id="pauseBtn">⏸</div>
        
        <!-- Touch controls (mobile only) -->
        <div class="touch-controls" id="touchControls">
            <div class="touch-btn" id="leftBtn">←</div>
            <div class="touch-btn" id="rightBtn">→</div>
        </div>
    </div>
    
    <!-- MAIN MENU -->
    <div class="menu" id="mainMenu">
        <h1>$PMUSH</h1>
        <div class="subtitle">LILLY PAD HOP</div>
        <div class="subtitle" style="font-size:1rem;letter-spacing:3px;margin-bottom:40px;">COSMIC ULTIMATE EDITION</div>
        
        <button onclick="startGame()">START COSMIC JUMP</button>
        <button onclick="showCapsShop()">CAP SHOP</button>
        <button onclick="showLeaderboard()">LEADERBOARD</button>
        
        <div style="margin-top:40px;font-size:0.9rem;opacity:0.8;">
            HIGH SCORE: <span id="menuHighScore">69420</span><br>
            MOON MODE UNLOCKED AT 10,000 PTS
        </div>
        
        <div style="position:absolute;bottom:30px;font-size:0.8rem;opacity:0.6;">
            MADE FOR THE $PMUSH ARMY • TO THE MOON 🌕
        </div>
    </div>
    
    <!-- PAUSE SCREEN -->
    <div class="pause-screen hidden" id="pauseScreen">
        <h1>PAUSED</h1>
        <button onclick="resumeGame()">RESUME JUMP</button>
        <button onclick="quitToMenu()">QUIT TO MENU</button>
        <div style="margin-top:30px;color:#ffd700;">CURRENT SCORE: <span id="pauseScore">0</span></div>
    </div>
    
    <!-- GAME OVER -->
    <div class="game-over-screen hidden" id="gameOverScreen">
        <h1>GAME OVER</h1>
        <div style="font-size:1.8rem;margin:10px 0;color:#ffd700;">FINAL SCORE</div>
        <div id="finalScore" style="font-size:3rem;color:#00f7ff;text-shadow:0 0 30px #00f7ff;">69420</div>
        <div id="newHigh" style="display:none;color:#ffd700;font-size:1.2rem;margin:10px 0;">★ NEW COSMIC RECORD ★</div>
        
        <button onclick="restartGame()">TRY AGAIN</button>
        <button onclick="quitToMenu()">BACK TO MENU</button>
        
        <div style="margin-top:30px;" id="moonModeUnlock" class="hidden">
            <span style="color:#c300ff;">🌕 MOON MODE ACHIEVED!</span><br>
            2× MULTIPLIER UNLOCKED
        </div>
    </div>
    
    <!-- CAP SHOP -->
    <div class="menu hidden" id="capShop" style="background:rgba(10,15,46,0.95);">
        <h1 style="font-size:2rem;">CAP SHOP</h1>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:900px;width:90%;margin:20px auto;">
            <!-- Populated by JS -->
        </div>
        <button onclick="hideCapShop()">BACK TO MENU</button>
    </div>
    
    <!-- LEADERBOARD -->
    <div class="menu hidden" id="leaderboardScreen" style="background:rgba(10,15,46,0.95);">
        <h1 style="font-size:2rem;">COSMIC LEADERBOARD</h1>
        <div id="leaderboardList" style="width:90%;max-width:500px;margin:20px auto;font-size:1.1rem;line-height:2.2rem;"></div>
        <button onclick="hideLeaderboard()">BACK</button>
    </div>
    
    <script>
        // =============================================
        // $PMUSH LILLY PAD HOP – COSMIC ULTIMATE EDITION
        // Single-file premium Doodle Jump clone
        // Fully self-contained • 60fps • Mobile-first
        // =============================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        let WIDTH = 0;
        let HEIGHT = 0;
        
        // Game variables
        let gameState = 'menu'; // menu, playing, paused, gameover
        let score = 0;
        let highScore = 69420;
        let multiplier = 1;
        let moonMode = false;
        let username = localStorage.getItem('pmushUsername') || 'ANON_MUSH';
        
        // Player
        let player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius: 28,
            rotation: 0,
            thirdEyePulse: 0,
            powerUp: null, // 'rocket', 'magnet', 'shield', etc.
            powerUpTime: 0,
            capType: 0, // 0 = default
            trail: []
        };
        
        // World
        let cameraY = 0;
        let maxHeightReached = 0;
        
        // Platforms
        let platforms = [];
        let platformTypes = ['normal', 'moving', 'breakable', 'disappearing'];
        
        // Particles
        let particles = [];
        
        // Stars (parallax background)
        let stars = [];
        
        // Enemies
        let enemies = [];
        
        // Collectibles (coins / power-ups)
        let collectibles = [];
        
        // Input
        let keys = {};
        let touchLeft = false;
        let touchRight = false;
        
        // Audio
        let audioCtx;
        
        // LocalStorage data
        let unlockedCaps = JSON.parse(localStorage.getItem('pmushUnlockedCaps')) || [0, 1, 2];
        let savedHighScores = JSON.parse(localStorage.getItem('pmushHighScores')) || [];
        
        // =============================================
        // RESIZE & INIT
        // =============================================
        function resizeCanvas() {
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
        }
        
        // =============================================
        // COSMIC BACKGROUND
        // =============================================
        function initStars() {
            stars = [];
            for (let i = 0; i < 220; i++) {
                stars.push({
                    x: Math.random() * WIDTH,
                    y: Math.random() * HEIGHT * 3,
                    size: Math.random() * 3.5 + 0.8,
                    speed: Math.random() * 0.6 + 0.2,
                    twinkle: Math.random() * Math.PI * 2,
                    color: Math.random() > 0.6 ? '#00f7ff' : '#ffffff'
                });
            }
        }
        
        function drawBackground() {
            // Deep cosmic gradient
            const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            grad.addColorStop(0, moonMode ? '#3a0055' : '#0a0f2e');
            grad.addColorStop(1, moonMode ? '#1a0033' : '#1a0033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Nebula glow
            ctx.save();
            ctx.globalAlpha = moonMode ? 0.35 : 0.2;
            ctx.fillStyle = '#c300ff';
            ctx.fillRect(0, HEIGHT * 0.3, WIDTH, HEIGHT * 0.4);
            ctx.restore();
            
            // Diagonal dashed lines
            ctx.strokeStyle = moonMode ? '#ffd700' : '#00f7ff';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.15;
            for (let i = -10; i < 25; i++) {
                ctx.beginPath();
                ctx.setLineDash([8, 18]);
                ctx.moveTo(-WIDTH + (i * 80 + (cameraY * 0.03) % 200), HEIGHT + 50);
                ctx.lineTo(WIDTH * 2 + (i * 80 + (cameraY * 0.03) % 200), -100);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.setLineDash([]);
            
            // Stars with parallax & twinkle
            const parallaxFactor = moonMode ? 1.8 : 1.3;
            stars.forEach(s => {
                const py = (s.y - cameraY * s.speed * parallaxFactor) % (HEIGHT * 3);
                if (py < -50 || py > HEIGHT + 50) return;
                
                const tw = Math.sin(s.twinkle + Date.now() / 180) * 0.5 + 1;
                ctx.globalAlpha = 0.6 + Math.sin(s.twinkle + Date.now() / 120) * 0.4;
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = s.color;
                ctx.fillRect(s.x, py, s.size * tw, s.size * tw);
                
                // Extra sparkle in moon mode
                if (moonMode && Math.random() > 0.92) {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(s.x + 1, py + 1, 1.5, 1.5);
                }
            });
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            
            // Floating neon text
            if (!moonMode && Math.random() > 0.97) {
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = '#00f7ff';
                ctx.font = '900 68px "Press Start 2P"';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#00f7ff';
                ctx.fillText('$PMUSH', WIDTH * 0.1 + Math.sin(Date.now() / 800) * 8, 120);
                ctx.fillText('TO THE MOON', WIDTH * 0.55, HEIGHT - 80);
                ctx.restore();
            }
        }
        
        // =============================================
        // PLAYER DRAWING (GLOWING MUSHROOM)
        // =============================================
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation * 0.015);
            
            const pulse = Math.sin(player.thirdEyePulse) * 4 + 8;
            
            // Glow base
            ctx.shadowBlur = 40;
            ctx.shadowColor = player.powerUp === 'rocket' ? '#ffd700' : (moonMode ? '#c300ff' : '#00f7ff');
            
            // Mushroom stem (white)
            ctx.fillStyle = '#f0f0ff';
            ctx.fillRect(-12, 8, 24, 38);
            
            // Stem highlight
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fillRect(-8, 10, 5, 32);
            
            // Cap (neon green → cyan)
            const capColor = player.powerUp === 'ghost' ? 'rgba(160,255,255,0.6)' : (moonMode ? '#a500ff' : '#00ff9d');
            ctx.fillStyle = capColor;
            ctx.beginPath();
            ctx.ellipse(0, 12, 32, 22, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Cap highlight
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(-8, 6, 18, 12, -0.4, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#111122';
            ctx.fillRect(-18, 4, 10, 12); // left
            ctx.fillRect(8, 4, 10, 12);   // right
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-15, 7, 4, 4);
            ctx.fillRect(11, 7, 4, 4);
            
            // Third eye (pulsing purple rocket)
            ctx.shadowBlur = player.powerUp === 'rocket' ? 60 : 35;
            ctx.shadowColor = player.powerUp === 'rocket' ? '#ffd700' : '#c300ff';
            ctx.fillStyle = player.powerUp === 'rocket' ? '#ffd700' : '#c300ff';
            ctx.beginPath();
            ctx.arc(0, -4, pulse, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye pupil
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#111122';
            ctx.beginPath();
            ctx.arc(0, -4, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Tiny white dot in third eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(-2, -7, 4, 4);
            
            // Rocket flame when active
            if (player.powerUp === 'rocket' && player.powerUpTime > 0) {
                ctx.shadowBlur = 50;
                ctx.shadowColor = '#ff4400';
                ctx.fillStyle = '#ff8800';
                ctx.beginPath();
                ctx.moveTo(-12, 28);
                ctx.lineTo(-4, 48 + Math.random() * 18);
                ctx.lineTo(12, 28);
                ctx.fill();
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.moveTo(-8, 28);
                ctx.lineTo(0, 60 + Math.random() * 12);
                ctx.lineTo(8, 28);
                ctx.fill();
            }
            
            ctx.restore();
            
            // Trail (comet effect)
            ctx.shadowBlur = 18;
            player.trail.forEach((p, i) => {
                ctx.globalAlpha = i / player.trail.length * 0.6;
                ctx.fillStyle = moonMode ? '#c300ff' : '#00f7ff';
                ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
        
        // =============================================
        // PLATFORM DRAWING
        // =============================================
        function drawPlatform(p) {
            const glowColor = p.type === 'moving' ? '#00f7ff' : 
                             (p.type === 'breakable' ? '#ff8800' : 
                             (p.type === 'disappearing' ? '#c300ff' : '#00ff9d'));
            
            ctx.shadowBlur = 22;
            ctx.shadowColor = glowColor;
            
            // Main platform
            ctx.fillStyle = glowColor;
            ctx.fillRect(p.x, p.y - cameraY, p.width, 18);
            
            // White top highlight
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(p.x + 3, p.y - cameraY + 2, p.width - 6, 6);
            
            // Type-specific visuals
            if (p.type === 'moving') {
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x + 8 + Math.sin(Date.now() / 200) * 12, p.y - cameraY + 8, 12, 4);
            }
            if (p.type === 'breakable') {
                ctx.fillStyle = '#ff4400';
                ctx.fillRect(p.x + 12, p.y - cameraY + 8, p.width - 24, 4);
            }
            if (p.type === 'disappearing' && p.alpha) {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = '#c300ff';
                ctx.fillRect(p.x, p.y - cameraY, p.width, 18);
                ctx.globalAlpha = 1;
            }
            
            ctx.shadowBlur = 0;
        }
        
        // =============================================
        // PARTICLES
        // =============================================
        function createParticles(x, y, count, hueShift = 0, big = false) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = big ? Math.random() * 8 + 4 : Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * vel,
                    vy: Math.sin(angle) * vel - (big ? 3 : 1),
                    life: big ? 55 : 32,
                    size: big ? Math.random() * 7 + 3 : Math.random() * 4 + 1,
                    color: `hsl(${220 + hueShift + Math.random() * 60}, 100%, 80%)`,
                    gravity: 0.12
                });
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.life--;
                p.vx *= 0.98;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
        
        function drawParticles() {
            ctx.shadowBlur = 12;
            for (let p of particles) {
                const alpha = p.life / 30;
                ctx.globalAlpha = alpha > 1 ? 1 : alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
        
        // =============================================
        // ENEMIES
        // =============================================
        function spawnEnemy() {
            if (Math.random() > 0.8 && enemies.length < 4) {
                const plat = platforms[Math.floor(Math.random() * platforms.length)];
                if (plat && plat.type !== 'disappearing') {
                    enemies.push({
                        x: plat.x + Math.random() * (plat.width - 40),
                        y: plat.y - 38,
                        vx: Math.random() > 0.5 ? 2.2 : -2.2,
                        type: Math.random() > 0.5 ? 'spiky' : 'buzzer',
                        wobble: 0
                    });
                }
            }
        }
        
        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y - cameraY);
            
            if (e.type === 'spiky') {
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ff0044';
                ctx.fillStyle = '#ff0044';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(22, 26);
                ctx.lineTo(-22, 26);
                ctx.fill();
                // spikes
                ctx.fillStyle = '#ffffff';
                for (let i = -18; i < 20; i += 9) {
                    ctx.fillRect(i, 8, 4, 12);
                }
            } else {
                // buzzer
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00ffcc';
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(-18, -6, 36, 14);
                ctx.fillStyle = '#111';
                ctx.fillRect(-12, -2, 8, 8);
                ctx.fillRect(4, -2, 8, 8);
            }
            ctx.restore();
        }
        
        // =============================================
        // COLLECTIBLES
        // =============================================
        function spawnCollectible(x, y) {
            if (Math.random() > 0.7) {
                collectibles.push({
                    x: x,
                    y: y - 30,
                    type: Math.random() > 0.6 ? 'power' : 'coin',
                    powerType: ['magnet', 'shield', 'hyper', 'triple'][Math.floor(Math.random() * 4)],
                    float: 0
                });
            }
        }
        
        function drawCollectible(c) {
            const py = c.y - cameraY + Math.sin(c.float) * 6;
            ctx.shadowBlur = 20;
            
            if (c.type === 'coin') {
                ctx.shadowColor = '#ffd700';
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(c.x, py, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111122';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('$', c.x, py + 8);
            } else {
                ctx.shadowColor = '#c300ff';
                ctx.fillStyle = '#c300ff';
                ctx.beginPath();
                ctx.arc(c.x, py, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '900 18px Arial';
                ctx.fillText('★', c.x, py + 7);
            }
            ctx.shadowBlur = 0;
        }
        
        // =============================================
        // PLATFORM GENERATION
        // =============================================
        function generatePlatforms(initial = false) {
            if (initial) {
                platforms = [];
                for (let i = 0; i < 18; i++) {
                    const type = platformTypes[Math.floor(Math.random() * platformTypes.length)];
                    platforms.push({
                        x: Math.random() * (WIDTH - 120),
                        y: HEIGHT - 80 - i * 68,
                        width: 110 + Math.random() * 40,
                        type: type,
                        vx: type === 'moving' ? (Math.random() > 0.5 ? 1.8 : -1.8) : 0,
                        alpha: type === 'disappearing' ? 1 : 1
                    });
                }
                player.y = HEIGHT - 140;
                return;
            }
            
            // Generate new at top
            while (platforms[platforms.length - 1].y - cameraY > -100) {
                const lastY = platforms[platforms.length - 1].y;
                const type = platformTypes[Math.floor(Math.random() * platformTypes.length)];
                platforms.push({
                    x: Math.random() * (WIDTH - 120),
                    y: lastY - 58 - Math.random() * 28,
                    width: 110 + Math.random() * 40,
                    type: type,
                    vx: type === 'moving' ? (Math.random() > 0.5 ? 1.8 : -1.8) : 0,
                    alpha: type === 'disappearing' ? 1 : 1
                });
                
                // Rare enemy or collectible
                if (Math.random() > 0.75) spawnEnemy();
                if (Math.random() > 0.65) spawnCollectible(platforms[platforms.length - 1].x + 40, platforms[platforms.length - 1].y);
            }
        }
        
        // =============================================
        // COLLISION & PHYSICS
        // =============================================
        function checkPlatformCollision() {
            if (player.vy <= 0) return false; // only bounce when falling
            
            for (let i = 0; i < platforms.length; i++) {
                const p = platforms[i];
                const py = p.y - cameraY;
                
                // One-way top collision
                if (
                    player.x + player.radius > p.x &&
                    player.x - player.radius < p.x + p.width &&
                    player.y + player.radius > py &&
                    player.y + player.radius - player.vy < py + 12
                ) {
                    
                    // Special platform handling
                    if (p.type === 'breakable') {
                        createParticles(p.x + p.width / 2, py + 9, 24, 30, true);
                        platforms.splice(i, 1);
                    } else if (p.type === 'disappearing') {
                        p.alpha -= 0.12;
                        if (p.alpha <= 0) platforms.splice(i, 1);
                    }
                    
                    // BOUNCE
                    player.y = py - player.radius;
                    player.vy = -15.8 - (moonMode ? 3 : 0);
                    
                    // JUICE
                    createParticles(player.x, py + 6, 18, -40);
                    if (Math.random() > 0.7) createParticles(player.x, py, 8, 80, true);
                    
                    // Perfect landing bonus
                    if (Math.abs(player.vy) > 13) {
                        score += 200 * multiplier;
                        createParticles(player.x, player.y - 30, 12, 160);
                    }
                    
                    // Combo fireworks
                    if (score % 800 < 100) {
                        createParticles(player.x, player.y - 60, 30, 200, true);
                    }
                    
                    // Play jump sound
                    playSound(420, 0.1, 'sine');
                    return true;
                }
            }
            return false;
        }
        
        function checkEnemyCollision() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const distX = player.x - e.x;
                const distY = (player.y - 18) - (e.y - cameraY);
                
                if (Math.sqrt(distX * distX + distY * distY) < 38) {
                    if (player.vy > 0 && distY > 0) {
                        // Jumped on enemy
                        player.vy = -18;
                        score += 100 * multiplier;
                        createParticles(e.x, e.y - cameraY, 22, 0, true);
                        enemies.splice(i, 1);
                        playSound(880, 0.2, 'sawtooth');
                    } else if (player.powerUp !== 'shield') {
                        // Hit!
                        gameOver();
                        return;
                    }
                }
            }
        }
        
        function checkCollectible() {
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                const dx = player.x - c.x;
                const dy = player.y - 18 - (c.y - cameraY);
                
                if (dx * dx + dy * dy < 1100) {
                    if (c.type === 'coin') {
                        score += 50 * multiplier;
                        createParticles(c.x, c.y - cameraY, 14, 60);
                        playSound(1200, 0.08, 'sine');
                    } else {
                        // Power-up
                        activatePowerUp(c.powerType);
                        createParticles(c.x, c.y - cameraY, 32, 220, true);
                    }
                    collectibles.splice(i, 1);
                }
            }
        }
        
        // =============================================
        // POWER-UPS
        // =============================================
        function activatePowerUp(type) {
            player.powerUp = type;
            player.powerUpTime = 420; // ~7 seconds at 60fps
            
            if (type === 'rocket') {
                player.vy = -32;
                createParticles(player.x, player.y + 30, 40, 30, true);
            } else if (type === 'shield') {
                // Void Shield aura
            } else if (type === 'magnet') {
                // Will pull coins in update
            } else if (type === 'hyper') {
                player.vy = -22;
            } else if (type === 'triple') {
                // Handled in bounce
            }
            
            playSound(660, 0.6, 'triangle');
        }
        
        // =============================================
        // GAME LOOP
        // =============================================
        function gameLoop() {
            if (gameState !== 'playing') {
                requestAnimationFrame(gameLoop);
                return;
            }
            
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            // Update camera
            const targetCamera = player.y - HEIGHT * 0.32;
            if (targetCamera < cameraY) {
                const diff = cameraY - targetCamera;
                cameraY -= diff * 0.18;
                score += Math.floor(diff * 0.8) * multiplier;
            }
            
            // Moon mode activation
            if (!moonMode && score >= 10000) {
                moonMode = true;
                multiplier = 2;
                createParticles(WIDTH / 2, HEIGHT / 2, 120, 280, true);
                playSound(240, 1.8, 'sine');
                document.getElementById('scoreDisplay').style.color = '#c300ff';
            }
            
            // Background
            drawBackground();
            
            // Update & draw platforms
            for (let i = platforms.length - 1; i >= 0; i--) {
                const p = platforms[i];
                if (p.type === 'moving') p.x += p.vx;
                if (p.x < -p.width) p.x = WIDTH;
                if (p.x > WIDTH) p.x = -p.width;
                
                // Remove offscreen
                if (p.y - cameraY > HEIGHT + 100) {
                    platforms.splice(i, 1);
                    continue;
                }
                
                drawPlatform(p);
            }
            
            // Generate more
            generatePlatforms();
            
            // Player physics
            player.vy += 0.68; // gravity
            player.x += player.vx;
            player.y += player.vy;
            
            // Side wrap
            if (player.x < -player.radius) player.x = WIDTH + player.radius;
            if (player.x > WIDTH + player.radius) player.x = -player.radius;
            
            // Friction
            player.vx *= 0.92;
            
            // Input
            if (keys['ArrowLeft'] || keys['a'] || touchLeft) player.vx -= 1.4;
            if (keys['ArrowRight'] || keys['d'] || touchRight) player.vx += 1.4;
            
            // Max speed
            if (player.vx > 11) player.vx = 11;
            if (player.vx < -11) player.vx = -11;
            
            // Rotation based on velocity
            player.rotation = player.vx * 1.8;
            
            // Third eye pulse
            player.thirdEyePulse += 0.22;
            
            // Power-up timer
            if (player.powerUpTime > 0) {
                player.powerUpTime--;
                if (player.powerUpTime === 0) player.powerUp = null;
            }
            
            // Trail
            player.trail.push({x: player.x, y: player.y + 18});
            if (player.trail.length > 14) player.trail.shift();
            
            // Draw player
            drawPlayer();
            
            // Enemies
            spawnEnemy();
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x += e.vx;
                e.wobble = Math.sin(Date.now() / 80) * 3;
                if (e.x < 0 || e.x > WIDTH) e.vx *= -1;
                drawEnemy(e);
            }
            checkEnemyCollision();
            
            // Collectibles
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                c.float += 0.1;
                // Magnet pull
                if (player.powerUp === 'magnet') {
                    const dx = player.x - c.x;
                    const dy = player.y - 18 - (c.y - cameraY);
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 220) {
                        c.x += dx / d * 7;
                        c.y += dy / d * 7;
                    }
                }
                drawCollectible(c);
            }
            checkCollectible();
            
            // Particles
            updateParticles();
            drawParticles();
            
            // Platform collision
            checkPlatformCollision();
            
            // Death condition
            if (player.y - cameraY > HEIGHT + 80) {
                gameOver();
                return;
            }
            
            // Update HUD
            document.getElementById('scoreDisplay').textContent = Math.floor(score).toLocaleString();
            
            // Save progress
            if (score > highScore) highScore = Math.floor(score);
            
            requestAnimationFrame(gameLoop);
        }
        
        // =============================================
        // SOUND ENGINE
        // =============================================
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playSound(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.type = type;
            gain.gain.value = 0.6;
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration + 0.1);
            
            // Mobile vibration
            if (navigator.vibrate) navigator.vibrate(12);
        }
        
        // =============================================
        // GAME STATE FUNCTIONS
        // =============================================
        function startGame() {
            document.getElementById('mainMenu').classList.add('hidden');
            
            // Reset everything
            score = 0;
            moonMode = false;
            multiplier = 1;
            cameraY = 0;
            player.x = WIDTH / 2;
            player.y = HEIGHT * 0.7;
            player.vx = 0;
            player.vy = -12;
            player.powerUp = null;
            player.trail = [];
            platforms = [];
            enemies = [];
            collectibles = [];
            particles = [];
            
            generatePlatforms(true);
            document.getElementById('scoreDisplay').style.color = '#00f7ff';
            
            gameState = 'playing';
            initAudio();
            gameLoop();
        }
        
        function gameOver() {
            gameState = 'gameover';
            
            const final = Math.floor(score);
            document.getElementById('finalScore').textContent = final.toLocaleString();
            
            const isNewHigh = final > highScore;
            document.getElementById('newHigh').style.display = isNewHigh ? 'block' : 'none';
            
            if (isNewHigh) {
                highScore = final;
                savedHighScores.unshift({ name: username, score: final });
                if (savedHighScores.length > 8) savedHighScores.pop();
                localStorage.setItem('pmushHighScores', JSON.stringify(savedHighScores));
            }
            
            // Save unlocked caps
            if (final > 100000) unlockedCaps.push(11);
            localStorage.setItem('pmushUnlockedCaps', JSON.stringify([...new Set(unlockedCaps)]));
            
            // Confetti on high score
            if (isNewHigh) {
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => createParticles(WIDTH * Math.random(), HEIGHT * Math.random(), 40, Math.random() * 360, true), i * 80);
                }
            }
            
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
        
        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        }
        
        function resumeGame() {
            document.getElementById('pauseScreen').classList.add('hidden');
            gameState = 'playing';
            gameLoop();
        }
        
        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            document.getElementById('pauseScore').textContent = Math.floor(score).toLocaleString();
            document.getElementById('pauseScreen').classList.remove('hidden');
        }
        
        function quitToMenu() {
            gameState = 'menu';
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('menuHighScore').textContent = highScore.toLocaleString();
        }
        
        // CAP SHOP
        const capNames = [
            '🍄 DEFAULT', '👑 NEON CROWN', '🌌 COSMIC HALO', '🌠 GALAXY TOPPER',
            '🔥 FLAMING EYE', '💎 DIAMOND MUSH', '⭐ STAR LORD', '⚡ VOID REAPER',
            '🌈 RAINBOW COMET', '💲 GOLDEN $PMUSH', '🌕 MOON GOD', '🌀 BLACK HOLE'
        ];
        
        function showCapsShop() {
            document.getElementById('mainMenu').classList.add('hidden');
            const shop = document.getElementById('capShop');
            const grid = shop.querySelector('div');
            grid.innerHTML = '';
            
            for (let i = 0; i < 12; i++) {
                const unlocked = unlockedCaps.includes(i);
                const el = document.createElement('div');
                el.style.cssText = `padding:15px;border:3px solid ${unlocked ? '#00f7ff' : '#555'};border-radius:12px;text-align:center;background:rgba(26,0,51,0.6);cursor:pointer;`;
                el.innerHTML = `<div style="font-size:3rem;margin-bottom:8px;">${i === 11 ? '🌀' : capNames[i].split(' ')[0]}</div>
                                <div style="font-size:0.9rem;">${capNames[i]}</div>
                                ${unlocked ? '<div style="color:#ffd700;font-size:0.7rem;margin-top:6px;">UNLOCKED</div>' : `<div style="color:#666;font-size:0.7rem;">${i === 11 ? '1,000,000 PTS' : 'LOCKED'}</div>`}`;
                
                if (unlocked) {
                    el.onclick = () => {
                        player.capType = i;
                        hideCapShop();
                        alert('CAP EQUIPPED! 🌟');
                    };
                }
                grid.appendChild(el);
            }
            shop.classList.remove('hidden');
        }
        
        function hideCapShop() {
            document.getElementById('capShop').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }
        
        // LEADERBOARD
        function showLeaderboard() {
            document.getElementById('mainMenu').classList.add('hidden');
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '<div style="color:#ffd700;margin-bottom:12px;">TOP COSMIC JUMPERS</div>';
            
            const scores = [...savedHighScores];
            if (scores.length === 0) {
                list.innerHTML += '<div style="opacity:0.5;">NO HEROES YET — BE THE FIRST TO THE MOON!</div>';
            } else {
                scores.sort((a, b) => b.score - a.score);
                scores.forEach((entry, i) => {
                    list.innerHTML += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #00f7ff;">
                        <span>#${i + 1} ${entry.name}</span><span style="color:#00f7ff">${entry.score.toLocaleString()}</span>
                    </div>`;
                });
            }
            document.getElementById('leaderboardScreen').classList.remove('hidden');
        }
        
        function hideLeaderboard() {
            document.getElementById('leaderboardScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }
        
        // =============================================
        // INPUT HANDLING
        // =============================================
        function setupInput() {
            window.addEventListener('keydown', e => {
                keys[e.key] = true;
                if (e.key === 'p' || e.key === 'P') pauseGame();
            });
            
            window.addEventListener('keyup', e => keys[e.key] = false);
            
            // Touch controls
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            leftBtn.addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; });
            leftBtn.addEventListener('touchend', () => touchLeft = false);
            rightBtn.addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; });
            rightBtn.addEventListener('touchend', () => touchRight = false);
            
            // Desktop click fallback for buttons
            leftBtn.addEventListener('mousedown', () => touchLeft = true);
            leftBtn.addEventListener('mouseup', () => touchLeft = false);
            rightBtn.addEventListener('mousedown', () => touchRight = true);
            rightBtn.addEventListener('mouseup', () => touchRight = false);
            
            // Pause button
            document.getElementById('pauseBtn').addEventListener('click', pauseGame);
            
            // Mobile visibility
            if ('ontouchstart' in window) {
                document.getElementById('touchControls').style.display = 'flex';
            }
            
            // Prevent scroll
            document.addEventListener('touchmove', e => {
                if (gameState === 'playing') e.preventDefault();
            }, { passive: false });
        }
        
        // =============================================
        // BOOT
        // =============================================
        function boot() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            initStars();
            
            // Load saved data
            const savedHigh = localStorage.getItem('pmushHighScore');
            if (savedHigh) highScore = parseInt(savedHigh);
            document.getElementById('menuHighScore').textContent = highScore.toLocaleString();
            
            setupInput();
            
            // Show main menu
            console.log('%c🚀 $PMUSH LILLY PAD HOP – COSMIC ULTIMATE EDITION LOADED 🚀', 'color:#00f7ff;font-family:monospace;font-size:13px');
            console.log('Mobile-first • 60fps • LocalStorage saved • Insanely juicy');
        }
        
        // Start everything
        window.onload = boot;
    </script>
</body>
